<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Desenha Junto</title></head><body><p id="loading">Carregando Desenha Junto…</p><script>Promise.all(Array.from({length:9},(_,i)=>fetch('partes/'+String(i).padStart(2,'0')+'.txt').then(r=>{if(!r.ok)throw Error('download');return r.text()}))).then(parts=>{let bin=atob(parts.join(''));let bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}).catch(()=>{document.getElementById('loading').textContent='Não foi possível carregar. Confira sua conexão e tente novamente.'});</script></body></html>
